[project]
name = "bili-ncm"
version = "1.3.4-alpha"
description = "基于blivedm和网易云音乐的B站直播点歌姬"
authors = [{ name = "Nya-WSL" }]
requires-python = ">=3.10,<3.14"
readme = "README.md"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "nicegui (>=2.15.0,<3.0.0)",
    "pywebview (>=5.3.2,<6.0.0)",
    "brotli (>=1.1.0,<2.0.0)",
    "aiohttp (>=3.11.18,<4.0.0)",
    "yarl (>=1.20.0,<2.0.0)",
    "pyinstaller (>=6.13.0,<7.0.0)",
    "inquirer (>=3.4.0,<4.0.0)",
]

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"
